<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Graph Rendering Demo</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="graphCanvas"></canvas>

  <script type="module">
    import { loadGraphData } from "./graphDataLoader.js";
    import { createRenderer } from "./renderer.js";
    import { drawRenderState } from "./draw.js";

    const GRAPH_DATA_URL = "../export/graph.json";

    const canvasElement = document.getElementById("graphCanvas");

    function resizeCanvasToWindow() {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;
    }

    async function loadGraph() {
      const response = await fetch(GRAPH_DATA_URL);
      if (!response.ok) {
        throw new Error(`Failed to fetch ${GRAPH_DATA_URL}: ${response.status} ${response.statusText}`);
      }
      const rawText = await response.text();
      const parsedJson = JSON.parse(rawText);
      return loadGraphData(parsedJson);
    }

    function runRenderLoop(gl, renderer) {
      function frame() {
        const renderState = renderer.getDisplayedState();
        drawRenderState(gl, renderState);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    async function main() {
      resizeCanvasToWindow();
      window.addEventListener("resize", resizeCanvasToWindow);

      const gl = canvasElement.getContext("webgl");
      if (!gl) {
        throw new Error("WebGL is not supported in this browser.");
      }

      const { vertices, edgeSequence } = await loadGraph();
      const renderer = createRenderer(vertices, edgeSequence);
      renderer.start();

      runRenderLoop(gl, renderer);
    }

    main().catch((error) => {
      console.error(error);
    });
  </script>
</body>
</html>
