<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Graph Rendering Demo</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #algorithmName {
      position: fixed;
      top: 16px;
      left: 16px;
      font-family: "Bahnschrift", sans-serif;
      color: #add8e6;
      font-size: 18px;
      pointer-events: none;
    }
    #parameterPanel {
      position: fixed;
      inset: 0;
      display: none;
      flex-wrap: wrap;
      align-content: center;
      justify-content: center;
      gap: 16px 32px;
      padding: 32px;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.92);
      font-family: "Bahnschrift", sans-serif;
      color: #add8e6;
      font-size: 18px;
    }
    #parameterPanel.open {
      display: flex;
    }
    #parameterPanel label {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    #parameterPanel input {
      width: 160px;
      padding: 4px 8px;
      font: inherit;
      color: #add8e6;
      background: #000;
      border: 1px solid #add8e6;
    }
    #parameterPanel label.rejected input {
      border-color: #ff6b6b;
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <canvas id="graphCanvas"></canvas>
  <div id="algorithmName"></div>
  <div id="parameterPanel"></div>

  <script type="module">
    import { startDemo } from "./main.js";

    const canvasElement = document.getElementById("graphCanvas");
    const algorithmNameElement = document.getElementById("algorithmName");
    const parameterPanelElement = document.getElementById("parameterPanel");

    function resizeCanvasToWindow() {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;
    }

    resizeCanvasToWindow();
    window.addEventListener("resize", resizeCanvasToWindow);

    try {
      startDemo(canvasElement, algorithmNameElement, parameterPanelElement);
    } catch (error) {
      console.error(error);
    }
  </script>
</body>
</html>
